<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WWR Motors</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background:#000;
    color:#fff;
    font-family:'Georgia',serif;
    overflow:hidden;
    height:100dvh;
    width:100vw;
  }

  .screen {
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 1s ease;
    z-index:1;
    background:#000;
  }
  .screen.active { opacity:1; pointer-events:all; z-index:10; }
  .screen.exit { opacity:0; pointer-events:none; z-index:5; }

  video.bg-video {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }

  .overlay {
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:1;
  }

  .brand {
    font-size:11px;
    letter-spacing:6px;
    color:rgba(255,255,255,0.4);
    text-transform:uppercase;
  }

  .btn-primary {
    width:100%;
    max-width:360px;
    padding:18px 24px;
    background:#cc2200;
    color:#fff;
    border:none;
    font-family:'Georgia',serif;
    font-size:13px;
    letter-spacing:4px;
    text-transform:uppercase;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:background 0.2s;
  }
  .btn-primary:active { background:#aa1800; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>
</head>
<body>

<!-- ===== LOADING ===== -->
<div class="screen active" id="s0">
  <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;gap:2rem;">
    <div style="font-size:11px;letter-spacing:6px;color:rgba(255,255,255,0.4);text-transform:uppercase;">W W R &nbsp; M O T O R S</div>
    <div style="width:200px;height:2px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;">
      <div id="loadBar" style="height:100%;background:#ff4422;width:0%;transition:width 0.3s ease;"></div>
    </div>
    <div id="loadText" style="font-size:10px;letter-spacing:4px;color:rgba(255,255,255,0.3);text-transform:uppercase;">CARGANDO EXPERIENCIA...</div>
  </div>
</div>

<!-- ===== S1: INICIO ===== -->
<div class="screen" id="s1">
  <div style="position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=800&q=80') center/cover no-repeat;z-index:0;"></div>
  <div class="overlay"></div>
  <div style="position:relative;z-index:2;width:100%;height:100dvh;padding:2rem 1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-top:3rem;padding-bottom:3rem;">
    <div class="brand">W W R &nbsp; M O T O R S</div>
    <div style="width:100%;">
      <h1 style="font-size:clamp(30px,9vw,46px);font-weight:900;line-height:1.1;text-transform:uppercase;letter-spacing:1px;margin-bottom:0.5rem;">
        ¿Tu moto se ve<br>como <span style="color:#ff4422;font-style:italic;">debe</span><br>verse?
      </h1>
      <div style="height:1rem;"></div>
      <div style="font-size:11px;letter-spacing:4px;color:rgba(255,255,255,0.5);display:flex;align-items:center;gap:8px;margin-bottom:3rem;">
        <span style="animation:pulse 1.5s infinite;">🔊</span>
        <span>SUBE EL VOLUMEN</span>
      </div>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;align-items:center;">
      <button class="btn-primary" onclick="iniciarCuenta()">
        <span>ENTRAR A LA EXPERIENCIA</span>
        <span>→</span>
      </button>
    </div>
  </div>
</div>


<!-- ===== S1B: COUNTDOWN ===== -->
<div class="screen" id="s1b">
  <div style="position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=800&q=80') center/cover no-repeat;z-index:0;"></div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,0.75);z-index:1;"></div>
  <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;gap:1.5rem;">
    <div style="font-size:11px;letter-spacing:6px;color:rgba(255,255,255,0.4);text-transform:uppercase;">W W R &nbsp; M O T O R S</div>
    <div style="font-size:13px;letter-spacing:4px;color:rgba(255,255,255,0.6);text-transform:uppercase;">LA EXPERIENCIA INICIA EN</div>
    <div id="countdown" style="font-size:120px;font-weight:900;line-height:1;color:#ff4422;font-family:'Georgia',serif;">5</div>
    <div style="width:260px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;">
      <div id="countBar" style="height:100%;background:#ff4422;width:0%;transition:width 0.1s linear;"></div>
    </div>
  </div>
</div>

<!-- ===== S2: VIDEO 1 ===== -->
<div class="screen" id="s2">
  <video class="bg-video" id="video1" playsinline
    src="https://wwrmotorszonadeatraccion.b-cdn.net/VIDEOMAIN.13%20MBFINAL.mp4"
    onerror="this.style.display='none'"></video>
</div>

<script>

  function goTo(n) {
    const prev = document.getElementById('s' + currentScreen);
    const next = document.getElementById('s' + n);
    if (!next) return;
    prev.classList.remove('active');
    prev.classList.add('exit');
    setTimeout(() => prev.classList.remove('exit'), 900);
    next.classList.add('active');
    currentScreen = n;
    if (n === 2) {
      const v = document.getElementById('video1');
      v.muted = false;
      v.currentTime = 0;
      v.play().catch(() => { v.muted = true; v.play(); });
      // Cuando termina el video pasa a llamada
      v.addEventListener('ended', () => {
        startVibration();
        goTo(3);
      }, { once: true });
    }
    if (n === 3) {
      startVibration();
      // Precargar video2 mientras el usuario ve la pantalla de llamada
      const v2 = document.getElementById('video2');
      if (v2) { v2.preload = 'auto'; v2.load(); }
    }
  }

  let vibAudio = null;

  function startVibration() {
    if (navigator.vibrate) {
      const pat = [];
      for(let i=0;i<30;i++) pat.push(400,500);
      navigator.vibrate(pat);
    }
    try {
      vibAudio = new Audio('https://wwrmotorszonadeatraccion.b-cdn.net/universfield-cell-phone-vibration-352298%20(1)%20(1).mp3');
      vibAudio.loop = true;
      vibAudio.volume = 1.0;
      vibAudio.play().catch(()=>{});
    } catch(e){}
  }

  function stopVibration() {
    if (navigator.vibrate) navigator.vibrate(0);
    if (vibAudio) { vibAudio.pause(); vibAudio.currentTime = 0; }
  }

  function contestar() {
    stopVibration();
    goTo(4); // siguiente pantalla
  }


  // S4: video despues de contestar
  const _origGoTo = goTo;
  goTo = function(n) {
    _origGoTo(n);
    if (n === 4) {
      const v = document.getElementById('video2');
      if (v) {
        v.muted = false;
        v.currentTime = 0;
        v.play().catch(() => { v.muted = true; v.play(); });
      }
    }
  };



  function iniciarCuenta() {
    // Empezar a precargar videos
    videosToLoad.forEach(({ id }) => {
      const v = document.getElementById(id);
      if (v && !v.src) v.load();
    });

    // Ir a pantalla countdown
    const prev = document.getElementById('s' + currentScreen);
    const next = document.getElementById('s1b');
    prev.classList.remove('active');
    prev.classList.add('exit');
    setTimeout(() => prev.classList.remove('exit'), 900);
    next.classList.add('active');
    currentScreen = '1b';

    // Countdown: muestra 5,4,3 pero solo espera 3 segundos
    let display = 5;
    const el = document.getElementById('countdown');
    const bar = document.getElementById('countBar');
    const total = 3000; // 3 segundos reales
    const start = Date.now();

    // Barra progresa en 3s
    bar.style.transition = 'width ' + total + 'ms linear';
    setTimeout(() => bar.style.width = '100%', 50);

    // Números bajan de 5 a 1 en 3s
    const nums = [5, 4, 3, 2, 1];
    nums.forEach((n, i) => {
      setTimeout(() => {
        if (el) el.textContent = n;
      }, (i / nums.length) * total);
    });

    // Arrancar video al terminar
    setTimeout(() => {
      goTo(2);
    }, total);
  }

  // ===== PRELOAD TODOS LOS VIDEOS =====
  const videosToLoad = [
    { id: 'video1', src: 'https://wwrmotorszonadeatraccion.b-cdn.net/VIDEOMAIN.13%20MBFINAL.mp4' },
    { id: 'video2', src: 'https://wwrmotorszonadeatraccion.b-cdn.net/2040%20-%201940%20VIDEO%2024%20MB.mp4' },
  ];

  let currentScreen = 0;

  function preloadVideos() {
    let loaded = 0;
    const total = videosToLoad.length;
    const bar = document.getElementById('loadBar');
    const txt = document.getElementById('loadText');

    videosToLoad.forEach(({ id, src }) => {
      const v = document.getElementById(id);
      if (!v) { loaded++; return; }
      v.preload = 'auto';
      v.src = src;

      const onProgress = () => {
        if (v.buffered.length > 0 && v.duration) {
          const pct = (v.buffered.end(0) / v.duration);
          const overall = ((loaded + pct) / total) * 100;
          if (bar) bar.style.width = Math.min(overall, 99) + '%';
        }
      };

      const onReady = () => {
        loaded++;
        const overall = (loaded / total) * 100;
        if (bar) bar.style.width = overall + '%';
        if (loaded >= total) allLoaded();
      };

      v.addEventListener('progress', onProgress);
      v.addEventListener('canplaythrough', onReady, { once: true });
      v.addEventListener('error', onReady, { once: true }); // si falla igual continua
      v.load();
    });

    // Fallback: si tarda más de 8s arranca igual
    setTimeout(() => { if (currentScreen === 0) allLoaded(); }, 8000);
  }

  function allLoaded() {
    if (currentScreen !== 0) return;
    const bar = document.getElementById('loadBar');
    const txt = document.getElementById('loadText');
    if (bar) bar.style.width = '100%';
    if (txt) txt.textContent = '¡LISTO!';
    setTimeout(() => goTo(1), 400);
  }

  // Arrancar precarga
  preloadVideos();

</script>

<!-- ===== S3: LLAMADA ENTRANTE ===== -->
<div class="screen" id="s3">
  <div style="position:absolute;inset:0;background:url('https://wwrmotorszonadeatraccion.b-cdn.net/fotopiloto.jpg') center/cover no-repeat;z-index:0;"></div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,0.65);z-index:1;"></div>

  <!-- Marco tipo WhatsApp -->
  <div style="position:absolute;inset:8px;border:1px solid rgba(255,255,255,0.08);z-index:2;pointer-events:none;">
    <div style="position:absolute;top:-1px;left:-1px;width:16px;height:16px;border-top:1px solid rgba(255,255,255,0.3);border-left:1px solid rgba(255,255,255,0.3);"></div>
    <div style="position:absolute;top:-1px;right:-1px;width:16px;height:16px;border-top:1px solid rgba(255,255,255,0.3);border-right:1px solid rgba(255,255,255,0.3);"></div>
    <div style="position:absolute;bottom:-1px;left:-1px;width:16px;height:16px;border-bottom:1px solid rgba(255,255,255,0.3);border-left:1px solid rgba(255,255,255,0.3);"></div>
    <div style="position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-bottom:1px solid rgba(255,255,255,0.3);border-right:1px solid rgba(255,255,255,0.3);"></div>
  </div>

  <div style="position:relative;z-index:3;width:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem;gap:0;">

    <!-- Marca -->
    <div style="font-size:11px;letter-spacing:6px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:2rem;">W W R &nbsp; M O T O R S</div>

    <!-- Año -->
    <div style="font-size:10px;letter-spacing:6px;color:#ff4422;text-transform:uppercase;margin-bottom:1rem;">A Ñ O &nbsp; 2 0 4 0</div>

    <!-- Avatar -->
    <div style="width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);overflow:hidden;margin-bottom:1.2rem;background:#1a1a1a;">
      <img src="https://wwrmotorszonadeatraccion.b-cdn.net/fotopiloto.jpg" style="width:100%;height:100%;object-fit:cover;">
    </div>

    <!-- Nombre -->
    <div style="font-size:24px;font-weight:700;font-style:italic;margin-bottom:0.4rem;">El Piloto</div>
    <div style="font-size:12px;letter-spacing:5px;color:rgba(255,255,255,0.5);text-transform:uppercase;margin-bottom:0.5rem;">P I L O T O &nbsp; L L A M A N D O</div>

    <!-- Estado parpadeando -->
    <div style="font-size:11px;letter-spacing:5px;color:#4ade80;text-transform:uppercase;margin-bottom:3rem;animation:blink 1.2s infinite;">L L A M A D A &nbsp; E N T R A N T E . . .</div>

    <!-- Botón contestar -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <button onclick="contestar()" style="
        width:90px;height:90px;
        border-radius:50%;
        background:#16a34a;
        border:4px solid #22c55e;
        cursor:pointer;
        display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        gap:4px;
        animation:ring 0.5s infinite alternate;
      ">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
        <div style="font-size:10px;font-weight:900;letter-spacing:2px;color:#fff;text-transform:uppercase;">CONTESTAR</div>
      </button>
    </div>

  </div>
</div>

<style>
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes ring {
    from{transform:scale(1);box-shadow:0 0 0 0 rgba(34,197,94,0.6);}
    to{transform:scale(1.08);box-shadow:0 0 0 14px rgba(34,197,94,0);}
  }
</style>


<!-- ===== S4: VIDEO DESPUÉS DE CONTESTAR ===== -->
<div class="screen" id="s4">
  <video class="bg-video" id="video2" playsinline
    src="https://wwrmotorszonadeatraccion.b-cdn.net/2040%20-%201940%20VIDEO%2024%20MB.mp4"
    onerror="this.style.display='none'"></video>
</div>

</body>
</html>
