<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WWR Motors</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background:#000;
    color:#fff;
    font-family:'Georgia',serif;
    overflow:hidden;
    height:100dvh;
    width:100vw;
  }

  .screen {
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 1s ease;
    z-index:1;
    background:#000;
  }
  .screen.active { opacity:1; pointer-events:all; z-index:10; }
  .screen.exit { opacity:0; pointer-events:none; z-index:5; }

  video.bg-video {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }

  .overlay {
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:1;
  }

  .brand {
    font-size:11px;
    letter-spacing:6px;
    color:rgba(255,255,255,0.4);
    text-transform:uppercase;
  }

  .btn-primary {
    width:100%;
    max-width:360px;
    padding:18px 24px;
    background:#cc2200;
    color:#fff;
    border:none;
    font-family:'Georgia',serif;
    font-size:13px;
    letter-spacing:4px;
    text-transform:uppercase;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:background 0.2s;
  }
  .btn-primary:active { background:#aa1800; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>
</head>
<body>

<!-- ===== S1: INICIO ===== -->
<div class="screen active" id="s1">
  <div style="position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=800&q=80') center/cover no-repeat;z-index:0;"></div>
  <div class="overlay"></div>
  <div style="position:relative;z-index:2;width:100%;height:100dvh;padding:2rem 1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-top:3rem;padding-bottom:3rem;">
    <div class="brand">W W R &nbsp; M O T O R S</div>
    <div style="width:100%;">
      <h1 style="font-size:clamp(30px,9vw,46px);font-weight:900;line-height:1.1;text-transform:uppercase;letter-spacing:1px;margin-bottom:0.5rem;">
        ¿Tu moto se ve<br>como <span style="color:#ff4422;font-style:italic;">debe</span><br>verse?
      </h1>
      <div style="height:1rem;"></div>
      <div style="font-size:11px;letter-spacing:4px;color:rgba(255,255,255,0.5);display:flex;align-items:center;gap:8px;margin-bottom:3rem;">
        <span style="animation:pulse 1.5s infinite;">🔊</span>
        <span>SUBE EL VOLUMEN</span>
      </div>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;align-items:center;">
      <button class="btn-primary" onclick="goTo(2)">
        <span>ENTRAR A LA EXPERIENCIA</span>
        <span>→</span>
      </button>
    </div>
  </div>
</div>

<!-- ===== S2: VIDEO 1 ===== -->
<div class="screen" id="s2">
  <video class="bg-video" id="video1" playsinline
    src="https://wwrmotorszonadeatraccion.b-cdn.net/videomain.mp4"
    onerror="this.style.display='none'"></video>
</div>

<script>
  let currentScreen = 1;

  function goTo(n) {
    const prev = document.getElementById('s' + currentScreen);
    const next = document.getElementById('s' + n);
    if (!next) return;
    prev.classList.remove('active');
    prev.classList.add('exit');
    setTimeout(() => prev.classList.remove('exit'), 900);
    next.classList.add('active');
    currentScreen = n;
    if (n === 2) {
      const v = document.getElementById('video1');
      v.muted = false;
      v.currentTime = 0;
      v.play().catch(() => { v.muted = true; v.play(); });
    }
  }
</script>
</body>
</html>
